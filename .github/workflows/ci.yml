name: CI

on:
  workflow_call:
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + NodeJS
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run ci:build
        env:
          CI: true

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium --only-shell

      - parallel:
          - name: Unit-Tests
            run: pnpm exec nx run-many -t test --configuration=ci
            env:
              CI: true

          - name: Playwright E2E Tests
            run: pnpm run ci:e2e
            env:
              CI: true

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/gblaster/playwright-report
          retention-days: 7

      - name: Test lint summary
        run: node --test .github/scripts/eslint-summary.test.mjs

      - name: Lint
        id: lint
        run: pnpm exec nx run-many -t lint --configuration=ci
        env:
          CI: true

      - name: Prepare lint summary
        id: lint-summary
        if: ${{ always() && steps.lint.outcome != 'skipped' }}
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          mapfile -d '' reports < <(find . \( -name node_modules -o -name .git -o -name .nx -o -name .angular \) -prune -o -name eslint-report.rdjson -type f -print0)
          node .github/scripts/eslint-summary.mjs "${reports[@]}"

      - name: Setup reviewdog
        id: reviewdog-setup
        if: ${{ always() && steps.lint-summary.outcome == 'success' }}
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.3

      - name: Annotate lint diagnostics
        if: ${{ always() && steps.reviewdog-setup.outcome == 'success' }}
        run: reviewdog -f=rdjson -name=eslint -reporter=github-annotations -filter-mode=nofilter < "$RUNNER_TEMP/eslint-report.rdjson"

      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.lint.outcome != 'skipped' }}
        with:
          name: lint-reports
          path: |
            **/eslint-report.rdjson
            !**/node_modules/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            firebase.json
            .firebaserc
          include-hidden-files: true
          retention-days: 1
