name: CI

on:
  workflow_call:
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + NodeJS
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run ci:build
        env:
          CI: true

      - name: Install Playwright Browsers
        run: pnpm exec  playwright install --with-deps

      - name: Tests
        parallel:
          - name: Unit-Tests
            run: pnpm run test:all
            env:
              CI: true

          - name: Playwright E2E Tests
            run: pnpm run ci:e2e
            env:
              CI: true

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/gblaster/playwright-report
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
